# Eurodomest HDMI Sync Box 2. gen (art. 3225765), plytka A4E32MGS02KR_V5, modul T1-U (BK7238)
# Komponent zewnetrzny "syncbox": katalog components/syncbox obok tego pliku.
#
# Co robi:
#  - tasma: UART2 na P0, 6,5 Mbaud 6N1 jak fabryczny firmware (inwerter na plytce), BRG, 28 sekcji
#  - P24: zasilanie/enable tasmy (aktywne LOW), wylaczane razem ze swiatlem
#  - wideo: odbior pola 48x27 RGB z naglowkiem i blokiem stanu ESP32 (4416 B) po SPI slave z DMA (P14-P17),
#    mapowanie na boki, wykrywanie czarnych pasow, wygladzanie, nasycenie, jasnosc, auto-off
#  - sceny = efekty ESPHome, kolor statyczny i malowanie sekcji z Home Assistant
#  - przycisk P26: krotko = wlacz/wylacz, 3 s = reset ustawien (w tym Wi-Fi)
#  - minutnik wylaczenia, liczniki FPS, czujnik sygnalu HDMI
#  - synchronizacja HDMI to EFEKT swiatla "HDMI sync" (jak sceny); ESPHome pamieta efekt
#    we flashu, wiec po zaniku zasilania box wraca do synchronizacji; bez sygnalu tasma jest czarna
#  - tasma odswiezana co 1 s nawet bez zmian (uklady po zaklóceniu nie trzymaja smieci)
#  - kalibracja kolorow obrazu w HA: poziomy czerni/bieli, balans bieli R/G/B, gamma, nasycenie
#  - wejscie E1.31 (sACN) i WLED UDP: efekty "E1.31" / "WLED" -> LedFx, Hyperion, WLED, xLights
#  - satelity: box wysyla kolory tasmy po E1.31 do innych swiatel (WLED, inne boxy z ESPHome);
#    dla zarowek bez E1.31 jest text_sensor "Average color" (#RRGGBB) do automatyzacji w HA
#
# Hasla i klucze sa w secrets.yaml (wzor: secrets.yaml.example) - nie wpisuj ich tutaj.

substitutions:
  name: hdmi-syncbox
  friendly_name: HDMI Sync Box

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

bk72xx:
  # generic-bk7238, nie t1-u: w module siedzi bootloader OpenBeken (klasyczny uklad Bekena,
  # OTA jako RBL do partycji download 0x132000). Uklad t1-u szykuje OTA dla bootloadera Tuya
  # i pod OBK "instaluje sie" bez efektu. Piny (P0, P24, P26, P14-P17) sa te same.
  board: generic-bk7238
  framework:
    version: recommended
    loglevel: warn

external_components:
  - source:
      type: local
      path: components

logger:
  level: DEBUG
  hardware_uart: UART1    # TX1 = P11 jak w fabrycznym firmware; P0 nalezy do tasmy
  baud_rate: 0            # bez wyjscia szeregowego: przy 115200 kazda linia logu wstrzymuje petle (linia statystyk 16-22 ms,
                          # dluzej niz klatka). Log idzie przez Wi-Fi. Do pracy z adapterem UART wpisz na ten czas 115200.

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  ap:
    ssid: "${name}-fallback"
    password: !secret ap_password

captive_portal:

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

web_server:
  port: 80
  version: 3
  sorting_groups:
    - id: grp_control
      name: "Control"
      sorting_weight: 10
    - id: grp_picture
      name: "Picture: personal tuning"
      sorting_weight: 20
    - id: grp_color
      name: "Strip color calibration"
      sorting_weight: 30
    - id: grp_mounting
      name: "Mounting calibration"
      sorting_weight: 40
    - id: grp_status
      name: "Status"
      sorting_weight: 50
    - id: grp_service
      name: "Service"
      sorting_weight: 60

# ------------------------------------------------------------------ wejscie z sieci
# Odbior E1.31/sACN (port 5568) - wlacz efekt "E1.31" na swietle. Universe 1, 28 sekcji x RGB = 84 kanaly.
e131:
  method: multicast        # unicast, jesli multicast w Twojej sieci nie dziala

# Odbior protokolu WLED UDP realtime (port 21324) - efekt "WLED". Dziala z LedFx, Hyperion ("wled" device).
wled:

# ------------------------------------------------------------------ Sync Box
syncbox:
  id: box
  enable_pin:
    number: P24
    inverted: true          # fizyczne LOW = tasma wlaczona
  color_order: BRG
  layout:
    left: 7
    top: 14
    right: 7
    bottom: 0               # 3-stronny montaz; dla 4-stronnego wpisz 14
    # Patrzac od PRZODU TV: tasma zaczyna sie w prawym dolnym rogu, idzie w gore prawej krawedzi,
    # przez gore w lewo i w dol lewej krawedzi (na rysunku od tylu to lewy dolny rog).
    start_corner: bottom_right
    direction: counter_clockwise
  refresh_interval: 1s      # ponowne wyslanie bufora, gdy nic sie nie zmienilo (0s = wylacz)
  average_color:
    name: "Average color"    # #RRGGBB, max 2 razy na sekunde; do automatyzacji HA dla zwyklych zarowek
    web_server:
      sorting_group_id: grp_status
      sorting_weight: 60
  # Satelity: inne swiatla odbierajace E1.31 (WLED: Sync -> E1.31, albo drugi box z ESPHome z efektem e131).
  # mode: average (sredni kolor), mirror (kopia sekcji 1:1), left/top/right/bottom (sredni kolor boku),
  #       full (cale pole, np. 48x27 = 1296 px w kolejnych universach od universe)
  # leds: ile pikseli RGB wyslac (dla pasków WLED np. 30); address: IP albo multicast
  satellites: []
  # Przyklad: tasma dookola sufitu (61 diod) i lampa sufitowa (41 diod), obie na ESPHome z efektem e131.
  # satellites:
  #   - name: "Sufit, obwod pokoju"
  #     address: 192.168.1.61     # staly adres lampy
  #     universe: 1               # jak w efekcie e131 lampy
  #     mode: room                # kolory krawedzi ekranu rozlozone po scianach
  #     walls:                    # sciany w kolejnosci tasmy lampy, od pierwszej diody (patrzac w strone TV)
  #       - back: 14              # sciana za widzem
  #       - left: 16
  #       - front: 15             # sciana z TV
  #       - right: 16
  #     max_fps: 60               # pakiet po kazdej klatce obrazu; 30 = co druga
  #     transition: 300ms
  #     blur: 3
  #     gamma: 2.8                # swiatlo ESPHome bez gamma_correct naklada 2.8
  #   - name: "Lampa sufitowa"
  #     address: 192.168.1.62
  #     universe: 1
  #     mode: average             # jeden kolor: srednia calej tasmy TV
  #     leds: 41
  #     max_fps: 60
  #     transition: 500ms
  #     gamma: 2.8
  video:
    enabled: true
    spi_mode: 0
    frame_size: 4416        # rozmiar bufora: 16 B naglowka + najwieksze pole 48 x 27 x 3 + 512 B bloku pomocniczego ESP32
    grid_width: 48          # wymiary dla ramki bez naglowka; z naglowkiem uklad podaje ESP32
    grid_height: 27
    pixel_order: RGB
    depth: 2                # ile komorek siatki od krawedzi brac do sredniej (3 = 20% ekranu = "splaszczone" kolory)
    smoothing: 0.2          # 0 = bez wygladzania, 0.9 = bardzo plynnie (przy interpolacji wystarczy malo)
    inner_mix: 25%          # doswietlenie ze srodka obrazu (wartosc startowa; w HA suwak "Video: inner fill")
    saturation: 1.5
    brightness: 100%
    # kalibracja obrazu (wartosci startowe; w HA sa suwaki "Video: ..." i "Color: ...", ktore je nadpisuja)
    black_level: 0          # wartosc z klatki uznawana za czern (podnies, gdy czern jest szara)
    white_level: 255        # wartosc uznawana za biel (obniz, gdy biel jest przygaszona)
    white_balance:
      red: 1.0
      green: 1.0
      blue: 0.85            # niebieskawa biel -> mniej B
    gamma_correct: 1.8      # 1.0 = liniowo, 1.6-2.2 = kontrast i zywsze kolory
    letterbox_detection: true
    signal_timeout: 1000ms
    auto_off: true
    log_frames: true        # na czas uruchamiania: co 60 klatek loguje pierwsze bajty
    interpolation: true     # plynne przejscia ~60 Hz miedzy klatkami z wolnego zrodla
  video_fps:
    name: "Video FPS"
    web_server:
      sorting_group_id: grp_status
      sorting_weight: 40
  led_fps:
    name: "Strip FPS"
    web_server:
      sorting_group_id: grp_status
      sorting_weight: 50
  # Stan wejscia HDMI z ESP32 (firmware v14.4+): format i tryb HDR, licznik zanikow sygnalu.
  hdmi_input:
    name: "HDMI input"
    web_server:
      sorting_group_id: grp_status
      sorting_weight: 20
    icon: mdi:video-input-hdmi
  hdmi_dropouts:
    name: "HDMI dropouts"
    web_server:
      sorting_group_id: grp_status
      sorting_weight: 30
    icon: mdi:alert-circle-outline
  # Konsola ESP32 po sieci (komendy, strojenie, wgrywanie firmware ESP32 bez kabla): tcp://<adres boxa>:2323.
  # Pierwsza linia wyslana przez klienta to haslo.
  esp32_console:
    port: 2323
    password: !secret console_password
  hdmi_signal:
    name: "HDMI signal"
    web_server:
      sorting_group_id: grp_status
      sorting_weight: 10

light:
  - platform: syncbox
    id: strip
    name: "TV backlight"
    web_server:
      sorting_group_id: grp_control
      sorting_weight: 10
    default_transition_length: 0s
    gamma_correct: 1.0
    restore_mode: RESTORE_DEFAULT_OFF
    effects:
      - syncbox_video:
          name: "HDMI sync"
      - e131:
          name: "E1.31"
          universe: 1
          channels: RGB
      - wled:
          name: "WLED"
      - addressable_rainbow:
          name: "Rainbow"
          speed: 10
          width: 28
      - addressable_rainbow:
          name: "Rainbow fast"
          speed: 40
          width: 14
      - addressable_color_wipe:
          name: "Color wipe"
          add_led_interval: 60ms
          colors:
            - red: 100%
              green: 0%
              blue: 0%
              num_leds: 7
            - red: 0%
              green: 100%
              blue: 0%
              num_leds: 7
            - red: 0%
              green: 0%
              blue: 100%
              num_leds: 7
            - red: 100%
              green: 100%
              blue: 0%
              num_leds: 7
      - addressable_scan:
          name: "Scan"
          move_interval: 40ms
          scan_width: 3
      - addressable_twinkle:
          name: "Twinkle"
          twinkle_probability: 8%
          progress_interval: 4ms
      - addressable_random_twinkle:
          name: "Random twinkle"
          twinkle_probability: 8%
          progress_interval: 32ms
      - addressable_fireworks:
          name: "Fireworks"
          update_interval: 32ms
          spark_probability: 12%
          use_random_color: true
          fade_out_rate: 110
      - addressable_flicker:
          name: "Flicker"
          update_interval: 16ms
          intensity: 8%
      - addressable_lambda:
          name: "Breathing"
          update_interval: 16ms
          lambda: |-
            static float phase = 0.0f;
            phase += 0.025f;
            float level = 0.15f + 0.85f * (0.5f + 0.5f * sinf(phase));
            Color c = current_color;
            it.all() = Color((uint8_t) (c.r * level), (uint8_t) (c.g * level), (uint8_t) (c.b * level));
      - addressable_lambda:
          name: "Wave"
          update_interval: 30ms
          lambda: |-
            static uint8_t pos = 0;
            pos++;
            for (int i = 0; i < it.size(); i++) {
              uint8_t v = (uint8_t) (128 + 127 * sinf((i * 24 + pos * 6) * 0.0245f));
              Color c = current_color;
              it[i] = Color((uint8_t) (c.r * v / 255), (uint8_t) (c.g * v / 255), (uint8_t) (c.b * v / 255));
            }

# ------------------------------------------------------------------ parametry wideo
# Kalibracja kolorow: wyswietl na TV biala plansze; suwakami balansu R/G/B doprowadz tasme do bieli.
# Potem plansza czarna -> "poziom czerni" tak, zeby tasma zgasla; szara/kolorowa -> gamma i nasycenie.
# Suwaki dzialaja przez on_value: wartosc zapamietana we flashu jest stosowana takze po restarcie (przy set_action
# komponent startowal z wartosciami z sekcji `video:`, a suwak w HA pokazywal co innego).
number:
  - platform: template
    name: "Video: inner fill"
    web_server:
      sorting_group_id: grp_picture
      sorting_weight: 50
    id: video_inner_mix
    icon: mdi:blur-radial
    optimistic: true
    restore_value: true
    initial_value: 25
    min_value: 0
    max_value: 40
    step: 1
    unit_of_measurement: "%"
    on_value:
      - lambda: id(box).set_inner_mix(x / 100.0f);
  - platform: template
    name: "Video: dim on dark center"
    web_server:
      sorting_group_id: grp_picture
      sorting_weight: 60
    id: video_inner_dim
    icon: mdi:brightness-4
    optimistic: true
    restore_value: true
    initial_value: 50
    min_value: 0
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    on_value:
      - lambda: id(box).set_inner_dim(x / 100.0f);   # 0 = wylaczone, 100 = tasma nie jasniejsza niz obraz w glebi
  - platform: template
    name: "Color: white balance R"
    web_server:
      sorting_group_id: grp_color
      sorting_weight: 10
    id: wb_r
    optimistic: true
    restore_value: true
    initial_value: 1.0
    min_value: 0.5
    max_value: 1.5
    step: 0.02
    on_value:
      - lambda: id(box).set_wb_channel(0, x);
  - platform: template
    name: "Color: white balance G"
    web_server:
      sorting_group_id: grp_color
      sorting_weight: 20
    id: wb_g
    optimistic: true
    restore_value: true
    initial_value: 1.0
    min_value: 0.5
    max_value: 1.5
    step: 0.02
    on_value:
      - lambda: id(box).set_wb_channel(1, x);
  - platform: template
    name: "Color: white balance B"
    web_server:
      sorting_group_id: grp_color
      sorting_weight: 30
    id: wb_b
    optimistic: true
    restore_value: true
    initial_value: 0.85
    min_value: 0.5
    max_value: 1.5
    step: 0.02
    on_value:
      - lambda: id(box).set_wb_channel(2, x);
  - platform: template
    name: "Color: gamma"
    web_server:
      sorting_group_id: grp_color
      sorting_weight: 40
    id: video_gamma
    optimistic: true
    restore_value: true
    initial_value: 1.8
    min_value: 1.0
    max_value: 2.6
    step: 0.1
    on_value:
      - lambda: id(box).set_video_gamma(x);
  - platform: template
    name: "Color: black level"
    web_server:
      sorting_group_id: grp_color
      sorting_weight: 60
    id: video_black
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 100
    step: 1
    on_value:
      - lambda: id(box).set_video_black(x);
  - platform: template
    name: "Color: white level"
    web_server:
      sorting_group_id: grp_color
      sorting_weight: 70
    id: video_white
    optimistic: true
    restore_value: true
    initial_value: 255
    min_value: 120
    max_value: 255
    step: 1
    on_value:
      - lambda: id(box).set_video_white(x);
  - platform: template
    name: "Video: brightness"
    web_server:
      sorting_group_id: grp_picture
      sorting_weight: 10
    id: video_brightness
    optimistic: true
    restore_value: true
    initial_value: 100
    min_value: 5
    max_value: 100
    step: 5
    unit_of_measurement: "%"
    on_value:
      - lambda: id(box).set_video_brightness(x / 100.0f);
  - platform: template
    name: "Video: saturation"
    web_server:
      sorting_group_id: grp_picture
      sorting_weight: 20
    id: video_saturation
    optimistic: true
    restore_value: true
    initial_value: 1.5
    min_value: 0.5
    max_value: 2.5
    step: 0.1
    on_value:
      - lambda: id(box).set_saturation(x);
  - platform: template
    name: "Video: smoothing"
    web_server:
      sorting_group_id: grp_picture
      sorting_weight: 30
    id: video_smoothing
    optimistic: true
    restore_value: true
    initial_value: 0.2
    min_value: 0.0
    max_value: 0.95
    step: 0.05
    on_value:
      - lambda: id(box).set_smoothing(x);
  - platform: template
    name: "Video: sampling depth"
    web_server:
      sorting_group_id: grp_picture
      sorting_weight: 40
    id: video_depth
    optimistic: true
    restore_value: true
    initial_value: 2
    min_value: 1
    max_value: 8
    step: 1
    on_value:
      - lambda: id(box).set_depth((uint8_t) x);
  # Domieszki kolorow tasmy (komponent v17.4): ile swiatla jednego kanalu dodac za inny kolor z obrazu. Biel i szarosci
  # sie nie zmieniaja. Np. "G do niebieskiego" rozjasnia i odbarwia niebieski z tasmy, "R do zielonego" ociepla zielen i zolty.
  - platform: template
    name: "Color: mix G into red"
    web_server:
      sorting_group_id: grp_color
      sorting_weight: 120
    icon: mdi:palette
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 40
    step: 1
    unit_of_measurement: "%"
    on_value:
      - lambda: id(box).set_color_mix(1, 0, x / 100.0f);
  - platform: template
    name: "Color: mix B into red"
    web_server:
      sorting_group_id: grp_color
      sorting_weight: 130
    icon: mdi:palette
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 40
    step: 1
    unit_of_measurement: "%"
    on_value:
      - lambda: id(box).set_color_mix(2, 0, x / 100.0f);
  - platform: template
    name: "Color: mix R into green"
    web_server:
      sorting_group_id: grp_color
      sorting_weight: 100
    icon: mdi:palette
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 40
    step: 1
    unit_of_measurement: "%"
    on_value:
      - lambda: id(box).set_color_mix(0, 1, x / 100.0f);
  - platform: template
    name: "Color: mix B into green"
    web_server:
      sorting_group_id: grp_color
      sorting_weight: 110
    icon: mdi:palette
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 40
    step: 1
    unit_of_measurement: "%"
    on_value:
      - lambda: id(box).set_color_mix(2, 1, x / 100.0f);
  - platform: template
    name: "Color: mix R into blue"
    web_server:
      sorting_group_id: grp_color
      sorting_weight: 90
    icon: mdi:palette
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 40
    step: 1
    unit_of_measurement: "%"
    on_value:
      - lambda: id(box).set_color_mix(0, 2, x / 100.0f);
  - platform: template
    name: "Color: mix G into blue"
    web_server:
      sorting_group_id: grp_color
      sorting_weight: 80
    icon: mdi:palette
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 40
    step: 1
    unit_of_measurement: "%"
    on_value:
      - lambda: id(box).set_color_mix(1, 2, x / 100.0f);
  # Mnoznik gammy samego niebieskiego (1.0 = jak "Color: gamma"). Wiekszy = niebieski narasta wolniej: ciemne i srednie
  # poziomy slabsze, pelny niebieski bez zmian.
  - platform: template
    name: "Color: blue gamma"
    web_server:
      sorting_group_id: grp_color
      sorting_weight: 50
    icon: mdi:chart-bell-curve-cumulative
    optimistic: true
    restore_value: true
    initial_value: 1.0
    min_value: 0.6
    max_value: 2.5
    step: 0.05
    on_value:
      - lambda: id(box).set_gamma_channel(2, x);
  - platform: template
    name: "Mounting: left side offset"
    web_server:
      sorting_group_id: grp_mounting
      sorting_weight: 10
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 6
    step: 1
    on_value:
      - lambda: id(box).set_side_offset(syncbox::SIDE_LEFT, (uint8_t) x);
  - platform: template
    name: "Mounting: top side offset"
    web_server:
      sorting_group_id: grp_mounting
      sorting_weight: 20
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 6
    step: 1
    on_value:
      - lambda: id(box).set_side_offset(syncbox::SIDE_TOP, (uint8_t) x);
  - platform: template
    name: "Mounting: right side offset"
    web_server:
      sorting_group_id: grp_mounting
      sorting_weight: 30
    optimistic: true
    restore_value: true
    initial_value: 0
    min_value: 0
    max_value: 6
    step: 1
    on_value:
      - lambda: id(box).set_side_offset(syncbox::SIDE_RIGHT, (uint8_t) x);
  - platform: template
    name: "Sleep timer"
    web_server:
      sorting_group_id: grp_control
      sorting_weight: 30
    id: countdown_minutes
    optimistic: true
    initial_value: 0
    min_value: 0
    max_value: 240
    step: 5
    unit_of_measurement: "min"
    set_action:
      - script.stop: countdown
      - if:
          condition:
            lambda: 'return x > 0;'
          then:
            - script.execute:
                id: countdown
                minutes: !lambda 'return (int) x;'

switch:
  - platform: template
    name: "Diagnostics: section log"
    web_server:
      sorting_group_id: grp_service
      sorting_weight: 10
    icon: mdi:text-box-search-outline
    entity_category: diagnostic
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: id(box).set_log_sections(true);
    turn_off_action:
      - lambda: id(box).set_log_sections(false);
  - platform: template
    name: "Satellites (E1.31)"
    web_server:
      sorting_group_id: grp_control
      sorting_weight: 20
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(box).set_satellites_enabled(true);
    turn_off_action:
      - lambda: id(box).set_satellites_enabled(false);
  - platform: template
    name: "Video: letterbox detection"
    web_server:
      sorting_group_id: grp_picture
      sorting_weight: 70
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - lambda: id(box).set_letterbox_detection(true);
    turn_off_action:
      - lambda: id(box).set_letterbox_detection(false);
  - platform: template
    name: "Video: frame interpolation"
    web_server:
      sorting_group_id: grp_picture
      sorting_weight: 80
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
