script:
  - id: countdown
    mode: restart
    parameters:
      minutes: int      # wartosc przekazana z suwaka (jego stan zmienia sie dopiero po wykonaniu set_action)
    then:
      - delay: !lambda 'return (uint32_t) minutes * 60000;'
      - light.turn_off: strip
      - number.set:
          id: countdown_minutes
          value: 0

# ------------------------------------------------------------------ przycisk na obudowie (P26)
binary_sensor:
  - platform: gpio
    id: user_button
    name: "Button"
    web_server:
      sorting_group_id: grp_status
      sorting_weight: 70
    pin:
      number: P26
      mode:
        input: true
        pullup: true
      inverted: true
    on_multi_click:
      - timing:
          - ON for at most 1s
          - OFF for at least 0.2s
        then:
          - light.toggle: strip
      - timing:
          - ON for at least 3s
        then:
          - logger.log: "Przycisk 3 s: reset ustawien"
          - button.press: do_factory_reset

button:
  - platform: factory_reset
    id: do_factory_reset
    name: "Factory reset (incl. Wi-Fi)"
    web_server:
      sorting_group_id: grp_service
      sorting_weight: 30
    entity_category: config
  - platform: restart
    name: "Restart"
    web_server:
      sorting_group_id: grp_service
      sorting_weight: 20
    entity_category: config
