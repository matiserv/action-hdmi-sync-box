; Alternatywa dla idf.py: PlatformIO sam pobiera toolchain i ESP-IDF 5.x.
;   pio run                      - kompilacja
;   pio run -t upload -t monitor - wgranie i monitor (port automatycznie lub --upload-port COMx)
[platformio]
src_dir = main

[env:syncbox]
platform = espressif32@6.9.0
framework = espidf
board = esp32dev
board_build.partitions = partitions.csv
monitor_speed = 115200
upload_speed = 460800
build_flags = -Wno-unused-function
